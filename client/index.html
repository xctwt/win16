<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <style>
      /* Avoid a white flash before the stylesheet loads */
      html, body { margin: 0; background: #000; overflow: hidden; }
      html.light, html.light body { background: #fff; }
    </style>
    <script>
      // Apply the saved theme before first paint
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");
    </script>
    <link rel="preload" href="/assets/icons/music.png" as="image" />
    <link rel="preload" href="/assets/icons/readme.png" as="image" />
    <link rel="preload" href="/assets/icons/chat.png" as="image" />
    <link rel="preload" href="/assets/icons/paint.png" as="image" />
    <link rel="preload" href="/assets/icons/images.png" as="image" />
    <link rel="preload" href="/assets/icons/settings.png" as="image" />
    <link rel="preload" href="/assets/icons/clicker.png" as="image" />
    <link rel="preload" href="/assets/icons/message.png" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
